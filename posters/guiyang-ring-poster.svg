  <title id="title">贵阳人民大道、太金线、数博大道、黔灵山路环形路网海报</title>
  <desc id="desc">米色复古地图风格海报，突出由人民大道、太金线、数博大道和黔灵山路围合的圆形道路。</desc>
  <defs>
